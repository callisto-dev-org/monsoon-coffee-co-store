name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  # ── Backend image ─────────────────────────────────────────────────────────
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/monsoon-backend:latest
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/monsoon-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  # ── Storefront image ──────────────────────────────────────────────────────
  build-storefront:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push storefront
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/storefront/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/monsoon-storefront:latest
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/monsoon-storefront:${{ github.sha }}
          # NEXT_PUBLIC_* are baked into the bundle at build time.
          build-args: |
            NEXT_PUBLIC_BASE_URL=${{ secrets.NEXT_PUBLIC_BASE_URL }}
            NEXT_PUBLIC_VERCEL_URL=${{ secrets.NEXT_PUBLIC_VERCEL_URL }}
            NEXT_PUBLIC_MEDUSA_BACKEND_URL=${{ secrets.NEXT_PUBLIC_MEDUSA_BACKEND_URL }}
            NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_DEFAULT_REGION=${{ secrets.NEXT_PUBLIC_DEFAULT_REGION }}
            NEXT_PUBLIC_STORE_ADDRESS=${{ secrets.NEXT_PUBLIC_STORE_ADDRESS }}
            MEDUSA_CLOUD_S3_HOSTNAME=${{ secrets.MEDUSA_CLOUD_S3_HOSTNAME }}
            MEDUSA_CLOUD_S3_PATHNAME=${{ secrets.MEDUSA_CLOUD_S3_PATHNAME }}
          cache-from: type=gha,scope=storefront
          cache-to: type=gha,scope=storefront,mode=max

  # ── Deploy to VPS ─────────────────────────────────────────────────────────
  deploy:
    needs: [build-backend, build-storefront]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Infra files (compose + nginx) live on the VPS but are version-controlled
      # here. Sync them before deploy so changes like volume mounts actually land
      # on the server — `compose pull` only updates images, never this file.
      - name: Sync infra files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.prod.yml,nginx/conf.d/*"
          target: "/opt/monsoon"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # GHCR_PAT: a read:packages PAT. Not needed if the GHCR packages are public.
          envs: GHCR_PAT
          script: |
            set -e
            cd /opt/monsoon
            # Log in only if a PAT is provided (skip when packages are public).
            if [ -n "$GHCR_PAT" ]; then
              echo "$GHCR_PAT" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            fi
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
