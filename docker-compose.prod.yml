# ──────────────────────────────────────────────────────────────────────────────
# Production stack for a single VPS. TLS terminates at Cloudflare (Full strict);
# nginx serves a Cloudflare Origin Certificate on :443 and is the only service
# published to the host. Images are built/pushed by CI to GHCR.
#
# Compose auto-loads ./.env for ${...} substitution below (GHCR_OWNER, IMAGE_TAG,
# POSTGRES_*). App secrets live in ./env/backend.env and ./env/storefront.env.
# ──────────────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/${GHCR_OWNER}/monsoon-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ./env/backend.env
    volumes:
      # Entrypoint copies ../../.env -> .env.production, so the file must exist
      # at apps/backend/.env inside the container.
      - ./env/backend.env:/app/apps/backend/.env:ro
      # Persist Medusa local file uploads. `medusa start` runs from
      # .medusa/server (see docker-entrypoint.sh), so the file provider's
      # default `static` dir resolves there — mount the volume at that path.
      - backend_uploads:/app/apps/backend/.medusa/server/static
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://localhost:9000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  storefront:
    image: ghcr.io/${GHCR_OWNER}/monsoon-storefront:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ./env/storefront.env
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # Cloudflare Origin Certificate (origin.pem + origin.key), placed on host.
      - /opt/monsoon/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - storefront

volumes:
  pgdata:
  redisdata:
  backend_uploads:
