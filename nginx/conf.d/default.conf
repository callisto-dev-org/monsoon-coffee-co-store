# ──────────────────────────────────────────────────────────────────────────────
# nginx reverse proxy behind Cloudflare (SSL/TLS mode: Full (strict)).
#
# Before deploying, replace every `monsooncoffee.co` below with your real domain.
# Cloudflare → origin is HTTPS using a Cloudflare Origin Certificate mounted at
# /etc/nginx/certs/origin.pem + origin.key.
# ──────────────────────────────────────────────────────────────────────────────

# Restore the real visitor IP from Cloudflare (so Medusa logs see real IPs, not
# the CF edge). CIDR list: https://www.cloudflare.com/ips/
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# Shared proxy settings.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        "upgrade";
proxy_read_timeout 300s;

# ── HTTP → HTTPS redirect (all hosts) ─────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name monsooncoffee.co www.monsooncoffee.co api.monsooncoffee.co;
    return 301 https://$host$request_uri;
}

# ── Backend: Medusa API + admin dashboard ─────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.monsooncoffee.co;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    # Admin uploads product images; nginx defaults to 1m and would 413.
    client_max_body_size 50m;

    location / {
        proxy_pass http://backend:9000;
    }
}

# ── Storefront: Next.js ───────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name monsooncoffee.co www.monsooncoffee.co;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    location / {
        proxy_pass http://storefront:8000;
    }
}
